name: GreenCal integration and calculator regression
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'index.html'
      - 'auth-client.js'
      - '.github/workflows/public-state-tests.yml'
  workflow_dispatch:
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check Worker and browser script
        run: |
          node --check src/worker.js
          node --check src/ai-worker.js
          node --check src/public-state.js
          node --check auth-client.js
      - name: Run all calculator, form, API and public UI tests
        run: node --test tests/*.test.mjs
