name: GreenCal demo-only Vercel PostgreSQL migration
on:
  pull_request:
    paths:
      - 'scripts/vercel/migrate-demo-on-build.mjs'
      - 'scripts/build-dist.mjs'
      - 'tests/vercel-dummy-migration.test.mjs'
      - '.github/workflows/vercel-dummy-migration.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/vercel/migrate-demo-on-build.mjs'
      - 'tests/vercel-dummy-migration.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-demo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gc_ci
          POSTGRES_PASSWORD: ci_synthetic_password
          POSTGRES_DB: greencal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gc_ci -d greencal_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GREENCAL_TEST_PG_URL: postgresql://gc_ci:ci_synthetic_password@127.0.0.1:5432/greencal_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Synthetic schema migration against disposable PostgreSQL
        run: node --test tests/vercel-dummy-migration.test.mjs
      - name: Existing Vercel API and identity regression
        run: npm run test:vercel
      - name: Default production build never applies database migration
        run: npm run build
