# Alur kerja rilis on-premise: uji, gate konfigurasi, dan DevSecOps.
# WP02 dan WP10. Master Execution Prompt v2.0 Bagian 09.3 dan 09.5.
#
# Prinsip alur kerja ini:
#   - Gate berjalan pada setiap PR, bukan hanya pada tag. Kontrol yang hanya
#     diperiksa saat rilis akan selalu ditemukan terlambat.
#   - Uji skema dijalankan terhadap PostgreSQL 16 sungguhan, bukan tiruan.
#     Jaminan RLS tidak dapat dibuktikan dengan mock.
#   - Tidak ada langkah yang memakai aksi pihak ketiga tanpa penyematan commit
#     SHA, karena tag aksi dapat dipindahkan oleh pemiliknya.

name: onprem-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onprem-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.11.0'

jobs:
  unit:
    name: Uji unit dan properti
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Bangun dist
        run: npm run build
      - name: Uji on-premise (presisi, IAM, audit, siklus, deployment)
        run: npm run test:onprem
      - name: Uji paket rilis
        run: node --test tests/onprem-release-bundle.test.mjs
      - name: Gate inventaris aksi dua arah
        # Menolak endpoint di kode yang tidak terdaftar DAN baris inventaris
        # yang rutenya tidak ada. Keduanya adalah penyimpangan dokumentasi.
        run: npm run inventory:check
      - name: Uji inventaris dan OpenAPI
        run: node --test tests/inventory-openapi.test.mjs
      - name: Pastikan OpenAPI tidak basi
        run: |
          npm run openapi:build
          if ! git diff --quiet -- docs/api/openapi.json; then
            echo "docs/api/openapi.json basi; jalankan npm run openapi:build dan commit hasilnya." >&2
            git --no-pager diff -- docs/api/openapi.json
            exit 1
          fi
      - name: Validasi registry CRMS 2026
        run: npm run registry:validate
      - name: Gate kontras WCAG 2.2 AA pada mode terang dan gelap
        # Kontras dihitung dari token yang benar-benar dipakai stylesheet.
        run: npm run design:contrast
      - name: Uji design system
        run: node --test tests/design-system.test.mjs
      - name: Uji warisan Vercel dan Cloudflare
        run: npm run test:vercel

  schema:
    name: Jaminan skema terhadap PostgreSQL 16 sungguhan
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: crms_onprem_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GREENCAL_ONPREM_PG_URL: postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/crms_onprem_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Rencana migrasi
        run: npm run migrate:onprem:plan
      - name: Pasang migrasi dan jalankan guard
        run: npm run migrate:onprem
      - name: Pasang ulang untuk membuktikan idempotensi
        run: npm run migrate:onprem
      - name: Beri keanggotaan peran agar uji dapat berganti peran
        run: psql "$GREENCAL_ONPREM_PG_URL" -c 'GRANT crms_owner, crms_app, crms_readonly TO postgres;'
      - name: Uji integrasi isolasi tenant, audit, dan presisi
        run: npm run test:onprem-postgres

  config-gate:
    name: Gate konfigurasi deployment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validasi sintaks compose
        run: |
          cp deploy/app.env.example deploy/app.env
          cp deploy/migrator.env.example deploy/migrator.env
          cp deploy/app.drc.env.example deploy/app.drc.env
          GREENCAL_VERSION=ci GREENCAL_DC_DB_HOST=db.dc.invalid \
            docker compose -f deploy/docker-compose.dc.yml config --quiet
          GREENCAL_VERSION=ci GREENCAL_DC_DB_HOST=db.dc.invalid \
            docker compose -f deploy/docker-compose.drc.yml config --quiet
          rm -f deploy/app.env deploy/migrator.env deploy/app.drc.env
      - name: Gate pengerasan on-premise
        # Gate ini SENGAJA gagal selama digest citra masih placeholder.
        # continue-on-error menjaga CI tetap informatif tanpa mengaburkan
        # keadaan: ringkasan di bawah mencatat hasilnya apa adanya.
        id: hardening
        continue-on-error: true
        run: npm run release:verify-onprem
      - name: Catat hasil gate pada ringkasan
        run: |
          {
            echo "## Gate pengerasan on-premise"
            echo
            if [ "${{ steps.hardening.outcome }}" = "success" ]; then
              echo "Lulus: seluruh kontrol pengerasan terpenuhi."
            else
              echo "GAGAL: masih ada blocker. Rilis produksi bank TIDAK diizinkan."
              echo
              echo '```'
              npm run --silent release:verify-onprem || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sast:
    name: SAST Semgrep
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      # Versi disematkan: pemindai yang berubah sendiri membuat hasil gate
      # tidak dapat dibandingkan antar rilis.
      - run: pip install semgrep==1.97.0
      - name: Jalankan Semgrep
        run: |
          semgrep scan --config p/javascript --config p/nodejs --config p/sql-injection \
            --config p/secrets --sarif --output semgrep.sarif \
            --metrics=off --error --severity ERROR || echo "SEMGREP_FOUND_ISSUES=1" >> "$GITHUB_ENV"
      - uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        if: always()
        with:
          sarif_file: semgrep.sarif
      - name: Gagalkan bila ada temuan severity ERROR
        if: env.SEMGREP_FOUND_ISSUES == '1'
        run: |
          echo "Semgrep menemukan temuan severity ERROR; tutup temuan sebelum rilis." >&2
          exit 1

  sca-sbom:
    name: SBOM dan pemindaian dependensi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit untuk kerentanan high dan critical
        run: npm audit --audit-level=high --omit=dev
      - name: Hasilkan SBOM CycloneDX
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          format: cyclonedx-json
          artifact-name: greencal-crms-sbom.cyclonedx.json
          output-file: greencal-crms-sbom.cyclonedx.json
      - name: Pindai SBOM dengan Grype
        uses: anchore/scan-action@abae52d4e4ebd8bbb7cc33ce1b5a525a3cd93120 # v5.3.0
        with:
          sbom: greencal-crms-sbom.cyclonedx.json
          fail-build: true
          severity-cutoff: high
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        if: always()
        with:
          name: sbom
          path: greencal-crms-sbom.cyclonedx.json
          retention-days: 90

  secret-scan:
    name: Pemindaian rahasia pada seluruh riwayat
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Riwayat penuh: rahasia yang sudah dihapus dari HEAD tetap ada di
          # riwayat dan tetap harus dicabut.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5 # v2.3.7
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  container-scan:
    name: Bangun dan pindai citra kontainer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bangun citra runtime
        run: docker build --target runtime -t greencal/crms-enterprise:ci .
      - name: Pindai citra dengan Grype
        uses: anchore/scan-action@abae52d4e4ebd8bbb7cc33ce1b5a525a3cd93120 # v5.3.0
        with:
          image: greencal/crms-enterprise:ci
          fail-build: true
          severity-cutoff: high
      - name: Pastikan citra tidak berjalan sebagai root
        run: |
          user=$(docker inspect -f '{{.Config.User}}' greencal/crms-enterprise:ci)
          echo "USER citra: ${user:-<kosong>}"
          case "$user" in
            ''|root|0|0:*) echo "Citra berjalan sebagai root; ditolak." >&2; exit 1 ;;
          esac
      - name: Pastikan tidak ada alat jaringan di citra runtime
        run: |
          for tool in curl wget git gcc; do
            if docker run --rm --entrypoint sh greencal/crms-enterprise:ci -c "command -v $tool" 2>/dev/null; then
              echo "$tool ada di citra runtime; permukaan serang terlalu besar." >&2
              exit 1
            fi
          done
          echo "Tidak ada alat jaringan di citra runtime."

  bundle:
    name: Paket rilis offline
    needs: [unit, schema, config-gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Bangun manifest paket
        # Keluar 2 berarti paket terbangun tetapi ditandai NOT_RELEASABLE.
        # Itu keadaan yang benar saat gate bank belum tertutup, jadi langkah ini
        # tidak gagal karenanya; yang gagal hanya galat nyata.
        run: |
          set +e
          npm run release:bundle
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          echo "BUNDLE_EXIT=$code" >> "$GITHUB_ENV"
      - name: Ringkas status kelayakan rilis
        run: |
          {
            echo "## Paket rilis offline"
            echo
            echo '```json'
            cat dist-release/manifest.sha256
            echo '```'
            if [ "${BUNDLE_EXIT}" = "2" ]; then
              echo
              echo "Paket ditandai **NOT_RELEASABLE**: gate bank belum tertutup."
              echo "Paket boleh dipakai UAT, tidak boleh dipakai produksi."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: onprem-release-manifest
          path: dist-release/
          retention-days: 90
