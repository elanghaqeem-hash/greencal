name: GreenCal issuer sector dropdown regression
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/security-sector-ui.test.mjs'
      - '.github/workflows/security-sector-ui.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/security-sector-ui.test.mjs'
      - '.github/workflows/security-sector-ui.yml'
permissions:
  contents: read
jobs:
  verify-sector-picker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test issuer UI, PCAF calculations, editor, and existing features
        run: |
          node --test tests/security-sector-ui.test.mjs tests/ai-editor-panel.test.mjs tests/business-travel.test.mjs tests/auth-ui.test.mjs tests/rbac.test.mjs
          node --check auth-client.js
          node --check src/worker.js
