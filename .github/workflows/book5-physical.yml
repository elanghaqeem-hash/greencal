name: OJK CRMS Book 5 Physical Risk Validation
on:
  pull_request:
    paths:
      - 'src/enterprise/book5.js'
      - 'src/enterprise/book5-api.js'
      - 'src/enterprise/api.js'
      - 'api/bridge.js'
      - 'assets/enterprise-book5.js'
      - 'assets/enterprise.js'
      - 'enterprise.html'
      - 'scripts/build-dist.mjs'
      - 'migrations/vercel/0102_book5_physical_risk.sql'
      - 'tests/book5-physical.test.mjs'
      - '.github/workflows/book5-physical.yml'
  push:
    paths:
      - 'src/enterprise/book5.js'
      - 'src/enterprise/book5-api.js'
      - 'src/enterprise/api.js'
      - 'api/bridge.js'
      - 'assets/enterprise-book5.js'
      - 'assets/enterprise.js'
      - 'enterprise.html'
      - 'scripts/build-dist.mjs'
      - 'migrations/vercel/0102_book5_physical_risk.sql'
      - 'tests/book5-physical.test.mjs'
      - '.github/workflows/book5-physical.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Book 5 source integrity and risk categories
        run: node --test tests/book5-physical.test.mjs
      - name: Verify build and UI workbench
        run: |
          node --check src/enterprise/book5.js
          node --check src/enterprise/book5-api.js
          node --check assets/enterprise-book5.js
          node scripts/build-dist.mjs
          test -s dist/assets/enterprise-book5.js
