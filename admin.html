<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrasi | GreenCal</title><style>body{font-family:system-ui,Arial;background:#f2f7f3;color:#163a30;margin:0;padding:24px}main{max-width:740px;margin:4vh auto;background:#fff;border:1px solid #d8e7df;border-radius:18px;padding:28px;box-shadow:0 14px 50px #08351d10}h1{font-size:25px}label{display:block;margin:14px 0;font-size:14px;font-weight:600}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #adc5b9;border-radius:10px;margin-top:5px;font:inherit}button{background:#13634b;color:white;border:0;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer;margin:8px 6px 8px 0}button.secondary{background:#e7f3ee;color:#164937}p#message{min-height:20px}section{border-top:1px solid #e1e9e4;margin-top:20px;padding-top:10px}table{width:100%;font-size:13px;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #e1e9e4;text-align:left}a{color:#13634b}@media(max-width:520px){main{padding:18px}body{padding:10px}}</style></head><body><main><h1>Administrasi GreenCal</h1><p id="message" role="status">Memeriksa hak akses...</p><p><a href="/">← Kalkulator</a> · <a href="#" id="logout">Keluar</a></p><div id="controls" hidden><section><h2>Pengaturan AI (hanya Admin)</h2><p>API Key tersimpan terenkripsi di server, tidak ditampilkan kembali.</p><form id="ai"><label>Provider<select id="provider"><option value="gemini">Google Gemini</option><option value="openai">OpenAI</option></select></label><label>Model<input id="model" required value="gemini-2.5-flash"></label><label>API Key<input id="key" type="password" autocomplete="new-password" required></label><button>Simpan API Key</button></form></section><section><h2>Tambah pengguna</h2><form id="userForm"><label>Email<input type="email" id="newEmail" required></label><label>Password awal (minimal 12 karakter)<input id="newPass" type="password" minlength="12" required></label><label>Peran<select id="role"><option value="user">Pengguna</option><option value="admin">Admin</option></select></label><button>Tambah Pengguna</button></form></section><section><h2>Daftar pengguna</h2><div style="overflow-x:auto"><table><thead><tr><th>Email</th><th>Peran</th><th>Status</th><th>Tindakan</th></tr></thead><tbody id="users"></tbody></table></div></section></div></main><script>
const msg=document.querySelector('#message'),out=s=>msg.textContent=s;
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});const j=await r.json();if(!r.ok)throw Error(j.error||'Request gagal');return j}
async function reload(){const u=await api('/api/users');document.querySelector('#users').replaceChildren(...u.users.map(x=>{const tr=document.createElement('tr');for(const val of [x.email,x.role,x.enabled?'Aktif':'Nonaktif']){const td=document.createElement('td');td.textContent=val;tr.append(td)}const td=document.createElement('td'),btn=document.createElement('button');btn.textContent=x.enabled?'Nonaktifkan':'Aktifkan';btn.className='secondary';btn.onclick=async()=>{try{await api('/api/users/'+x.id,{method:'PATCH',body:JSON.stringify({role:x.role,enabled:!x.enabled})});await reload()}catch(e){out(e.message)}};td.append(btn);tr.append(td);return tr}))}
document.querySelector('#ai').onsubmit=async e=>{e.preventDefault();try{await api('/api/ai/settings',{method:'PUT',body:JSON.stringify({provider:provider.value,model:model.value,apiKey:key.value})});key.value='';out('API Key berhasil disimpan secara terenkripsi')}catch(e){out(e.message)}};
document.querySelector('#userForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/users',{method:'POST',body:JSON.stringify({email:newEmail.value,password:newPass.value,role:role.value})});newPass.value='';out('Pengguna berhasil ditambahkan');await reload()}catch(e){out(e.message)}};
document.querySelector('#logout').onclick=async e=>{e.preventDefault();await api('/api/logout',{method:'POST'});location.href='/login.html'};
(async()=>{try{const me=await api('/api/me');if(me.user.role!=='admin')throw Error('Hanya Admin yang dapat mengakses pengaturan ini');document.querySelector('#controls').hidden=false;const settings=await api('/api/ai/settings');if(settings.settings?.provider)provider.value=settings.settings.provider;if(settings.settings?.model)model.value=settings.settings.model;out('Masuk sebagai '+me.user.email);await reload()}catch(e){out(e.message)}})();
</script></body></html>
