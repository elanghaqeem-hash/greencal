# PostgreSQL host-based authentication — on-premise GreenCal CRMS Enterprise.
# WP02. Urutan baris menentukan: baris pertama yang cocok dipakai.
#
# Prinsip:
#   - Tidak ada "trust" di mana pun, termasuk untuk koneksi lokal.
#   - Tidak ada "md5"; hanya scram-sha-256.
#   - Seluruh koneksi TCP wajib TLS (hostssl), dengan verifikasi sertifikat
#     klien untuk peran replikasi.
#   - Baris terakhir menolak sisanya secara eksplisit, sehingga kelalaian
#     menulis aturan berakhir pada penolakan, bukan pada default yang longgar.

# TYPE      DATABASE        USER             ADDRESS            METHOD

# Soket lokal: hanya untuk pemeliharaan di dalam kontainer basis data.
local       all             crms_bootstrap                      scram-sha-256
local       all             crms_migrator                       scram-sha-256

# Aplikasi dan auditor dari jaringan internal compose, wajib TLS.
hostssl     crms_onprem     crms_app         10.0.0.0/8         scram-sha-256
hostssl     crms_onprem     crms_app         172.16.0.0/12      scram-sha-256
hostssl     crms_onprem     crms_readonly    10.0.0.0/8         scram-sha-256
hostssl     crms_onprem     crms_readonly    172.16.0.0/12      scram-sha-256

# Pemasang migrasi: hanya dari subnet administrasi, dan dicatat log DDL.
hostssl     crms_onprem     crms_migrator    10.10.0.0/16       scram-sha-256

# Replikasi ke DRC: TLS dengan verifikasi sertifikat klien, bukan kata sandi
# saja. clientcert=verify-full menuntut CN sertifikat sama dengan nama peran.
hostssl     replication     crms_replicator  10.20.0.0/16       scram-sha-256 clientcert=verify-full

# Penolakan eksplisit untuk sisanya, termasuk koneksi tanpa TLS.
host        all             all              0.0.0.0/0          reject
host        all             all              ::/0               reject
local       all             all                                 reject
