# PostgreSQL 16 — konfigurasi on-premise GreenCal CRMS Enterprise.
# WP02. Master Execution Prompt v2.0 Bagian 02.1 dan Bagian 07.
#
# Nilai sumber daya di bawah disetel untuk node 8 vCPU / 32 GB RAM. Operator
# wajib menyesuaikan dan mencatat hasil penyetelan pada runbook kapasitas;
# nilai di sini adalah titik awal yang aman, bukan rekomendasi akhir.

# --- Koneksi -----------------------------------------------------------------
listen_addresses = '*'          # dibatasi jaringan internal compose, bukan di sini
port = 5432
max_connections = 200
superuser_reserved_connections = 5

# TLS wajib. Koneksi tanpa TLS ditolak pg_hba.conf.
ssl = on
ssl_cert_file = '/run/secrets/db_server_cert'
ssl_key_file = '/run/secrets/db_server_key'
ssl_ca_file = '/run/secrets/db_ca_cert'
ssl_min_protocol_version = 'TLSv1.3'
ssl_prefer_server_ciphers = on

# --- Memori ------------------------------------------------------------------
shared_buffers = 8GB
effective_cache_size = 24GB
work_mem = 32MB
maintenance_work_mem = 1GB
huge_pages = try

# --- WAL, checkpoint, dan arsip ----------------------------------------------
# replica cukup untuk streaming replication ke DRC; logical tidak diperlukan
# dan menambah beban WAL.
wal_level = replica
wal_compression = lz4
max_wal_size = 8GB
min_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Arsip WAL adalah dasar PITR. Perintah arsip menulis ke volume lokal yang
# disalin ke penyimpanan WORM oleh pekerjaan terjadwal; tidak ada panggilan
# jaringan keluar di sini.
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300

# --- Replikasi ---------------------------------------------------------------
max_wal_senders = 8
max_replication_slots = 8
wal_keep_size = 4GB
hot_standby = on
hot_standby_feedback = on
# synchronous_commit on tanpa synchronous_standby_names berarti commit menunggu
# flush lokal saja. Menyalakan replikasi sinkron menukar latensi tulis dengan
# RPO nol; keputusan itu milik bank dan dicatat pada keputusan arsitektur.
synchronous_commit = on

# --- Integritas --------------------------------------------------------------
# Checksum halaman data mendeteksi kerusakan penyimpanan senyap. Diaktifkan
# saat initdb lewat --data-checksums; baris ini menolak menonaktifkannya.
ignore_checksum_failure = off
full_page_writes = on
fsync = on
data_sync_retry = off

# Row-Level Security tidak boleh dapat dimatikan per sesi oleh peran biasa.
row_security = on

# --- Audit dan log -----------------------------------------------------------
# Log basis data BUKAN pengganti log audit aplikasi; keduanya saling melengkapi.
logging_collector = on
log_destination = 'stderr,csvlog'
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 0
log_truncate_on_rotation = off
log_min_messages = warning
log_min_error_statement = error
# Seluruh DDL dicatat: perubahan skema pada sistem pelaporan regulator wajib
# dapat ditelusuri.
log_statement = 'ddl'
log_connections = on
log_disconnections = on
log_hostname = off
log_line_prefix = '%m [%p] %q user=%u db=%d app=%a client=%h '
log_lock_waits = on
log_temp_files = 0
log_checkpoints = on
log_autovacuum_min_duration = 0
# Kueri lambat ditandai, bukan diputus; pemutusan diatur statement_timeout.
log_min_duration_statement = 1000

# --- Batas waktu -------------------------------------------------------------
# Kueri yang menggantung tidak boleh menahan kunci tanpa batas.
statement_timeout = 120000
lock_timeout = 10000
idle_in_transaction_session_timeout = 60000
# Transaksi menganggur yang menahan konteks tenant adalah risiko kebocoran;
# batas di atas menutupnya.

# --- Autovacuum --------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- Lokal dan presisi -------------------------------------------------------
timezone = 'Asia/Jakarta'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
# extra_float_digits tidak relevan bagi nilai finansial karena skema melarang
# kolom pecahan biner sama sekali; nilai di bawah hanya untuk diagnostik.
extra_float_digits = 0

# --- Ekstensi ----------------------------------------------------------------
# Hanya ekstensi yang sudah terpasang dari paket distribusi boleh dimuat.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
