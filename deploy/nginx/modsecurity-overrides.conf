# Pengecualian ModSecurity khusus GreenCal CRMS Enterprise.
# WP02. Setiap pengecualian WAJIB menyebut alasan, rute terbatas, dan tanggal
# peninjauan ulang. Pengecualian tanpa ketiganya ditolak pada review keamanan.
#
# Berkas ini dimuat SEBELUM aturan CRS, sehingga pengecualian di sini
# menargetkan permintaan tertentu saja, bukan mematikan aturan global.

# Rentang ID 10000-10999 dialokasikan untuk aturan kustom GreenCal.

# --- 10001 --------------------------------------------------------------------
# Alasan: unggahan portofolio dan bukti berupa CSV serta XLSX besar memicu
# false positive pada deteksi anomali protokol multipart (CRS 200002/200004).
# Rute: /api/uploads, /api/portfolio/import, /api/evidence saja.
# Peninjauan: 2027-05-01.
SecRule REQUEST_URI "@rx ^/api/(uploads|portfolio/import|evidence)" \
    "id:10001,phase:1,pass,nolog,\
     ctl:ruleRemoveById=200002,\
     ctl:ruleRemoveById=200004"

# --- 10002 --------------------------------------------------------------------
# Alasan: payload JSON laporan memuat rumus regulatori sebagai teks (mis.
# "EAD * LGD * PD") yang menyerupai pola injeksi SQL pada 942100.
# Rute: hanya PUT dan PATCH pada rute workpaper Buku 6.
# Peninjauan: 2027-05-01.
SecRule REQUEST_METHOD "@rx ^(PUT|PATCH)$" \
    "id:10002,phase:1,pass,nolog,chain"
    SecRule REQUEST_URI "@rx ^/api/book6/workpapers" \
        "t:none,ctl:ruleRemoveTargetById=942100;ARGS:formula_expression"

# --- 10003 --------------------------------------------------------------------
# Aturan kustom, BUKAN pengecualian: tolak permintaan yang mencoba menetapkan
# konteks tenant lewat header. Konteks tenant hanya berasal dari token
# terverifikasi sisi server; permintaan yang mencobanya adalah serangan.
SecRule REQUEST_HEADERS_NAMES "@rx (?i)^x-crms-(tenant|role|subject)$" \
    "id:10003,phase:1,deny,status:400,log,\
     msg:'Upaya menetapkan konteks tenant lewat header permintaan',\
     severity:CRITICAL,tag:'greencal/tenant-isolation'"

# --- 10004 --------------------------------------------------------------------
# Aturan kustom: tolak permintaan tanpa Content-Type pada metode bertubuh.
SecRule REQUEST_METHOD "@rx ^(POST|PUT|PATCH)$" \
    "id:10004,phase:1,chain,deny,status:415,log,\
     msg:'Metode bertubuh tanpa Content-Type'"
    SecRule &REQUEST_HEADERS:Content-Type "@eq 0"
