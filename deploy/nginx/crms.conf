# Nginx + ModSecurity (OWASP CRS) — edge on-premise GreenCal CRMS Enterprise.
# WP02. Master Execution Prompt v2.0 Bagian 02.1 dan Bagian 07.
#
# Edge adalah satu-satunya komponen yang menyentuh jaringan selain intranet
# internal. Tugasnya: terminasi TLS, WAF, pembatasan laju, dan penerusan ke
# aplikasi. Tidak ada logika bisnis di sini.
#
# Template ini diproses entrypoint citra modsecurity-crs; ${VAR} diganti saat
# kontainer menyala.

# Pembatasan laju: zona terpisah untuk autentikasi, karena serangan penebakan
# kata sandi berpola berbeda dari penelusuran laporan.
limit_req_zone $binary_remote_addr zone=crms_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=crms_auth:10m    rate=5r/m;
limit_conn_zone $binary_remote_addr zone=crms_conn:10m;

# Pemetaan $connection_upgrade dibiarkan kosong: aplikasi tidak memakai
# WebSocket, dan upgrade yang tidak diminta tidak diteruskan.
map $http_upgrade $connection_upgrade { default ""; }

server {
    listen ${SSL_PORT} ssl;
    http2 on;
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:CRMS_TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    # OCSP stapling dinonaktifkan: tidak ada egress ke responder CA dari
    # intranet, dan stapling yang gagal hanya menambah latensi.
    ssl_stapling off;

    # Identitas server tidak diumumkan.
    server_tokens off;

    # Batas ukuran unggahan: berkas bukti dan portofolio naik lewat rute khusus
    # yang menerima sampai 256 MB; sisanya dibatasi ketat.
    client_max_body_size 8m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 16k;

    limit_conn crms_conn 32;

    # ModSecurity aktif; aturan dan tingkat paranoia diatur variabel lingkungan
    # pada compose (PARANOIA=2, ANOMALY_INBOUND=5).
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    # Header keamanan juga dipasang di edge, berlapis di atas header aplikasi,
    # agar respons galat yang dihasilkan nginx sendiri pun terlindungi.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control "no-store" always;

    # Metode selain yang dipakai aplikasi ditolak di edge.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Healthcheck dan readiness tidak boleh terekspos ke intranet luas.
    location = /readyz {
        allow 10.10.0.0/16;   # subnet administrasi
        deny all;
        proxy_pass ${BACKEND};
    }
    location = /healthz {
        access_log off;
        allow 127.0.0.1;
        allow 10.10.0.0/16;
        deny all;
        proxy_pass ${BACKEND};
    }

    # Rute autentikasi: pembatasan laju jauh lebih ketat.
    location ~ ^/api/(auth|login|session) {
        limit_req zone=crms_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/crms-proxy.inc;
    }

    # Unggahan bukti dan portofolio: batas ukuran lebih besar, tetap ber-WAF.
    location ~ ^/api/(uploads|portfolio/import|evidence) {
        client_max_body_size 256m;
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        limit_req zone=crms_general burst=10 nodelay;
        include /etc/nginx/crms-proxy.inc;
    }

    location / {
        limit_req zone=crms_general burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/crms-proxy.inc;
    }

    # Halaman galat tidak membocorkan jejak tumpukan maupun versi.
    error_page 400 401 403 404 405 429 /__error.html;
    error_page 500 502 503 504 /__error.html;
    location = /__error.html {
        internal;
        default_type text/html;
        return 200 '<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Permintaan tidak dapat diproses</title></head><body><h1>Permintaan tidak dapat diproses</h1><p>Hubungi administrator CRMS institusi Anda dan sebutkan waktu kejadian.</p></body></html>';
    }
}

# Pengalihan HTTP ke HTTPS. Tidak ada konten yang dilayani lewat HTTP.
server {
    listen ${PORT};
    server_name ${SERVER_NAME};
    server_tokens off;
    return 308 https://$host$request_uri;
}
