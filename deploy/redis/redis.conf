# Redis 7 — cache dan antrean on-premise GreenCal CRMS Enterprise.
# WP02. Redis TIDAK dipakai sebagai sumber kebenaran: seluruh data yang masuk
# laporan regulator hidup di PostgreSQL. Isi Redis boleh hilang tanpa
# mempengaruhi hasil perhitungan mana pun.

bind 0.0.0.0
port 6379
protected-mode yes

# Perintah berbahaya dinonaktifkan. FLUSHALL dan FLUSHDB dihapus agar satu
# perintah salah tidak mengosongkan cache seluruh tenant; KEYS dihapus karena
# memindai seluruh keyspace memblokir server.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN ""

# Autentikasi wajib; kata sandi disuntikkan operator lewat ACL file di luar
# repositori, bukan ditulis di sini.
aclfile /usr/local/etc/redis/users.acl

maxmemory 2gb
maxmemory-policy allkeys-lru

# Persistensi dimatikan: cache tidak menyimpan apa pun yang perlu bertahan,
# dan menonaktifkannya menghilangkan satu salinan data di luar basis data.
save ""
appendonly no

# Tidak ada panggilan keluar.
enable-module-command no

timeout 300
tcp-keepalive 60
loglevel notice
