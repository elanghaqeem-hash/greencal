<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk | GreenCal</title><style>body{font-family:system-ui,Arial;background:#f2f7f3;color:#163a30;margin:0;padding:24px}main{max-width:740px;margin:4vh auto;background:#fff;border:1px solid #d8e7df;border-radius:18px;padding:28px;box-shadow:0 14px 50px #08351d10}h1{font-size:25px}label{display:block;margin:14px 0;font-size:14px;font-weight:600}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #adc5b9;border-radius:10px;margin-top:5px;font:inherit}button{background:#13634b;color:white;border:0;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer;margin:8px 6px 8px 0}button.secondary{background:#e7f3ee;color:#164937}p#message{min-height:20px}section{border-top:1px solid #e1e9e4;margin-top:20px;padding-top:10px}table{width:100%;font-size:13px;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #e1e9e4;text-align:left}a{color:#13634b}@media(max-width:520px){main{padding:18px}body{padding:10px}}</style></head><body><main><h1>GreenCal</h1><p>Masuk untuk menggunakan Kalkulator Emisi dan analisis AI.</p><form id="login"><label>Email<input type="email" id="email" autocomplete="username" required></label><label>Kata sandi<input type="password" id="password" autocomplete="current-password" required minlength="12"></label><button>Masuk</button></form><p id="message" role="status"></p></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#message');m.textContent='Memverifikasi...';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Login gagal');location.href='/';}catch(err){m.textContent=err.message}}</script></body></html>
